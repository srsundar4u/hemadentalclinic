<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patient profile | Dental Clinic</title><link rel="stylesheet" th:href="@{/css/clinic.css}"></head>
<body><main>
    <p class="brand">Dr Hemashree's Dental Studio</p>
    <section class="card">
        <a th:href="@{/patients}">← Patient list</a>
        <p class="success" role="status" th:if="${message}" th:text="${message}"></p>
        <h1 th:text="${patient.fullName}"></h1>
        <dl><dt>Patient ID</dt><dd th:text="${patient.id}"></dd><dt>Phone</dt><dd th:text="${patient.phone}"></dd><dt>Date of birth</dt><dd th:text="${patient.dateOfBirth == null ? 'Not provided' : #temporals.format(patient.dateOfBirth, 'dd MMM yyyy')}"></dd><dt>Address</dt><dd th:text="${patient.address == null || patient.address.isBlank() ? 'Not provided' : patient.address}"></dd></dl>
        <a class="button-link" th:href="@{/patients/{id}/edit(id=${patient.id})}">Edit details</a>
        <a class="button-link" th:href="@{/appointments/new(patientId=${patient.id})}">Book appointment</a>
        <h2>Appointments</h2>
        <p th:if="${#lists.isEmpty(appointments)}">No appointments yet.</p>
        <ul th:unless="${#lists.isEmpty(appointments)}"><li th:each="a : ${appointments}"><a th:href="@{/appointments/{id}(id=${a.id})}" th:text="${#temporals.format(a.startsAt, 'dd MMM yyyy, hh:mm a')}"></a> — <span th:text="${#strings.replace(a.status, '_', ' ')}"></span></li></ul>
        <section th:if="${dentist}"><h2>Clinical visit history</h2>
            <p th:if="${#lists.isEmpty(visits)}">No consultation records yet.</p>
            <ul th:unless="${#lists.isEmpty(visits)}"><li th:each="visit : ${visits}"><a th:href="@{/consultations/{id}(id=${visit.appointmentId})}" th:text="${'Visit for appointment ' + visit.appointmentId}"></a> — <span th:text="${visit.completed() ? 'Completed' : 'Draft'}"></span></li></ul>
        </section>
        <p class="hint">Charges, payments and balances will be added with the billing screen.</p>
    </section>
</main></body></html>
